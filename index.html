<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PVZ3 游戏谜题入口</title>
  <meta name="description" content="PVZ3 静态谜题入口页，包含倒水求解器与解码器。">
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(15, 23, 42, 0.92);
      --border: rgba(148, 163, 184, 0.16);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #34d399;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 1.6rem;
      line-height: 1.1;
    }
    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .lang-switch {
      display: inline-flex;
      padding: 4px;
      gap: 4px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.7);
    }
    .lang-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .lang-switch button.active {
      background: rgba(56, 189, 248, 0.16);
      color: var(--text);
    }
    .stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .tool,
    .repo {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .tool {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .tool h2 {
      margin: 0 0 8px;
      font-size: 1.08rem;
      line-height: 1.2;
    }
    .tool p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }
    .tool .metric {
      margin-top: 8px;
      font-size: 0.84rem;
      color: #cbd5e1;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 132px;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(56, 189, 248, 0.28);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.18), rgba(52, 211, 153, 0.14));
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(56, 189, 248, 0.48);
    }
    .repo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      background: rgba(11, 17, 30, 0.78);
    }
    .repo strong {
      display: block;
      font-size: 0.98rem;
      margin-bottom: 4px;
    }
    .repo span {
      color: var(--muted);
      font-size: 0.88rem;
    }
    .foot {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.6;
    }
    @media (max-width: 720px) {
      .topbar,
      .tool,
      .repo {
        flex-direction: column;
        align-items: stretch;
      }
      .btn {
        width: 100%;
      }
      .lang-switch {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <h1 id="pageTitle"></h1>
        <div class="subtitle" id="pageSubtitle"></div>
      </div>
      <div class="lang-switch" aria-label="Language switcher">
        <button id="langZh" type="button">中文</button>
        <button id="langEn" type="button">English</button>
      </div>
    </header>

    <main class="stack">
      <section class="tool">
        <div>
          <h2 id="solverTitle"></h2>
          <p id="solverDesc"></p>
          <p class="metric" id="solverMetric"></p>
        </div>
        <a class="btn" id="solverLink" href="./pvz3_water_sort_solver.html"></a>
      </section>

      <section class="tool">
        <div>
          <h2 id="decoderTitle"></h2>
          <p id="decoderDesc"></p>
          <p class="metric" id="decoderMetric"></p>
        </div>
        <a class="btn" id="decoderLink" href="./pvz3_decode_solver.html"></a>
      </section>

      <a class="repo" href="https://github.com/Peteroooooooo/pvz3-game-puzzle-solver" target="_blank" rel="noreferrer">
        <div>
          <strong id="repoTitle"></strong>
          <span id="repoHint"></span>
        </div>
        <div>→</div>
      </a>

      <div class="foot" id="footText"></div>
    </main>
  </div>

  <script>
    const STRINGS = {
      zh: {
        title: 'PVZ3 游戏谜题入口',
        subtitle: '两个静态网页工具',
        solverTitle: 'Water Sort Solver',
        solverDesc: '倒水求解器。',
        solverMetric: '100 局基准：100% 通关，平均 25.3 步，平均加料 12.0 格。',
        solverLink: '打开',
        decoderTitle: 'PVZ Decoder Solver',
        decoderDesc: '卡牌反馈推演工具。',
        decoderMetric: '默认策略：4 轮锁定目标。',
        decoderLink: '打开',
        repoTitle: 'GitHub 仓库',
        repoHint: '查看源码和说明',
        foot: '粉丝向项目，与 PopCap、EA 或官方 Plants vs. Zombies 团队无关。'
      },
      en: {
        title: 'PVZ3 Game Puzzle Hub',
        subtitle: 'Two static browser tools',
        solverTitle: 'Water Sort Solver',
        solverDesc: 'Water sort puzzle solver.',
        solverMetric: '100-run benchmark: 100% solved, 25.3 average steps, 12.0 average refill units.',
        solverLink: 'Open',
        decoderTitle: 'PVZ Decoder Solver',
        decoderDesc: 'Card feedback decoding tool.',
        decoderMetric: 'Default strategy: 4-round lock target.',
        decoderLink: 'Open',
        repoTitle: 'GitHub Repository',
        repoHint: 'View source and notes',
        foot: 'Fan-made project. Not affiliated with PopCap, EA, or the official Plants vs. Zombies team.'
      }
    };

    const root = document.documentElement;
    const btnZh = document.getElementById('langZh');
    const btnEn = document.getElementById('langEn');
    const nodes = {
      pageTitle: document.getElementById('pageTitle'),
      pageSubtitle: document.getElementById('pageSubtitle'),
      solverTitle: document.getElementById('solverTitle'),
      solverDesc: document.getElementById('solverDesc'),
      solverMetric: document.getElementById('solverMetric'),
      solverLink: document.getElementById('solverLink'),
      decoderTitle: document.getElementById('decoderTitle'),
      decoderDesc: document.getElementById('decoderDesc'),
      decoderMetric: document.getElementById('decoderMetric'),
      decoderLink: document.getElementById('decoderLink'),
      repoTitle: document.getElementById('repoTitle'),
      repoHint: document.getElementById('repoHint'),
      footText: document.getElementById('footText')
    };

    function applyLang(lang) {
      const copy = STRINGS[lang] || STRINGS.zh;
      const isEn = lang === 'en';
      root.lang = isEn ? 'en' : 'zh-CN';
      btnZh.classList.toggle('active', !isEn);
      btnEn.classList.toggle('active', isEn);
      const toolLang = isEn ? 'en' : 'zh';

      document.title = copy.title;
      nodes.pageTitle.textContent = copy.title;
      nodes.pageSubtitle.textContent = copy.subtitle;
      nodes.solverTitle.textContent = copy.solverTitle;
      nodes.solverDesc.textContent = copy.solverDesc;
      nodes.solverMetric.textContent = copy.solverMetric;
      nodes.solverLink.textContent = copy.solverLink;
      nodes.solverLink.href = `./pvz3_water_sort_solver.html?lang=${toolLang}`;
      nodes.decoderTitle.textContent = copy.decoderTitle;
      nodes.decoderDesc.textContent = copy.decoderDesc;
      nodes.decoderMetric.textContent = copy.decoderMetric;
      nodes.decoderLink.textContent = copy.decoderLink;
      nodes.decoderLink.href = `./pvz3_decode_solver.html?lang=${toolLang}`;
      nodes.repoTitle.textContent = copy.repoTitle;
      nodes.repoHint.textContent = copy.repoHint;
      nodes.footText.textContent = copy.foot;
      localStorage.setItem('pvz3-home-lang', lang);
    }

    btnZh.addEventListener('click', () => applyLang('zh'));
    btnEn.addEventListener('click', () => applyLang('en'));

    applyLang(localStorage.getItem('pvz3-home-lang') || 'zh');
  </script>
</body>
</html>
